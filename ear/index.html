<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Crop Advisory System</title>
  <meta name="description" content="AI-powered crop advisory for small farmers" />
</head>

<body>
  <div id="root"></div>
  <div id="global-error"
    style="display:none; position:fixed; top:0; left:0; right:0; background:red; color:white; padding:20px; z-index:9999; text-align:left; font-family:monospace; white-space:pre-wrap;">
  </div>
  <script>
    window.addEventListener('error', function (event) {
      const el = document.getElementById('global-error');
      el.style.display = 'block';
      el.innerText += '\n' + event.message + '\n' + (event.error ? event.error.stack : '');
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
